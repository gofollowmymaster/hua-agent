[project]
name = "aplus-sql-python-api"
version = "0.1.0"
description = "FastAPI parity implementation for the Aplus SQL service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30.0,<1",
  "deepagents>=0.2.0,<1",
  "fastapi>=0.115.0,<1",
  "httpx>=0.28.0,<1",
  "langchain>=1.0.0,<2",
  "langchain-openai>=0.3.0,<2",
  "langchain-text-splitters>=0.3.0,<2",
  "langgraph>=0.6.0,<2",
  "lark-oapi>=1.4.0,<2",
  "openpyxl>=3.1.0,<4",
  "pydantic-settings>=2.7.0,<3",
  "pyjwt>=2.10.0,<3",
  "pypdf>=5.0.0,<7",
  "python-docx>=1.1.0,<2",
  "python-multipart>=0.0.18,<1",
  "python-pptx>=1.0.0,<2",
  "redis>=5.2.0,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2",
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.25.0,<2",
  "respx>=0.22.0,<1",
  "ruff>=0.9.0,<1",
  "types-openpyxl>=3.1.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_api"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/python_api/routes/*.py" = ["B008"]
"src/python_api/security.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lark_oapi", "lark_oapi.*"]
ignore_missing_imports = true
