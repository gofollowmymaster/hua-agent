services:
  postgres:
    build:
      context: ../..
      dockerfile: apps/python-api/docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: aplus_python_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d aplus_python_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ../api/prisma/rag/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7.4-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  pytest:
    build:
      context: ../..
      dockerfile: apps/python-api/docker/integration-test.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
