apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app_name: ${IMAGE_NAME}
  name: ${IMAGE_NAME}
  namespace: ${PROFILE}
spec:
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ${IMAGE_NAME}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ${IMAGE_NAME}
    spec:
      containers:
        - name: ${IMAGE_NAME}
          image: registry.cn-hangzhou.aliyuncs.com/app-backend/${IMAGE_NAME}:${tag}
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          #resources:
            #limits:
              #cpu: "2"
              #memory: "512Mi"
            #requests:
              #cpu: "2"
              #memory: "256Mi"
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: registry-demo1
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app_project: ${IMAGE_NAME}
  name: ${IMAGE_NAME}
  namespace: ${PROFILE}
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    app: ${IMAGE_NAME}
  type: ClusterIP